version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard_gen_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port binding can be configured via DB_HOST_PORT env var (default 5434)
      - "${DB_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      # Host port binding can be configured via APP_HOST_PORT env var (default 4000)
      - "${APP_HOST_PORT:-4000}:${PORT:-4000}"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/dashboard_gen_prod
      SECRET_KEY_BASE: CYsdBRv5g0YHCAKdWm3P1fQIK86sE8lX44fu7/UCJ0eWPbC64iCnYxwF5TDajFta
      PHX_HOST: localhost
      # Container port for the application; can be overridden via PORT env var (default 4000)
      PORT: "${PORT:-4000}"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MIX_ENV: prod
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_uploads:/app/priv/static/uploads

volumes:
  postgres_data:
  app_uploads:
